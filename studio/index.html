<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#100d0b">
    <meta name="color-scheme" content="dark light">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="BrownBook">
    <title>BrownBook</title>
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <script>
        // The previous version of BrownBook could leave a service worker behind; make sure none lingers.
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (registrations) {
                registrations.forEach(function (registration) { registration.unregister(); });
            });
        }
    </script>
    <script>
        // Apply the last used theme before first paint to avoid a flash of the default colours.
        try {
            var vars = JSON.parse(localStorage.getItem('brownbook-theme-vars') || 'null');
            if (vars) {
                var root = document.documentElement;
                ['bg', 'panel', 'ink', 'muted', 'accent', 'accent2'].forEach(function (key) { root.style.setProperty('--' + key, vars[key]); });
                root.dataset.light = vars.light ? 'true' : 'false';
            }
        } catch (error) { /* first visit or storage blocked */ }
    </script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
